[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cytokineqsp-latent"
version = "0.1.0"
description = "Hybrid mechanistic and latent-dynamics models for cytokine-driven epithelial remodeling."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
jax = ["jax>=0.4", "diffrax>=0.5", "optax>=0.2"]
torch = ["torch>=2.2", "torchdiffeq>=0.2"]
geo = ["GEOparse>=2.0"]
dev = ["pytest>=8.0", "ruff>=0.5", "jupyterlab>=4.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/cytokineqsp_latent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
